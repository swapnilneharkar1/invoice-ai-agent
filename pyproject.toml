[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bfl-gst-invoice-validator"
version = "0.1.0"
description = "BFL GST invoice extraction and validation application"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38,<2",
    "pydantic>=2.7,<3",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "python-dateutil>=2.9,<3",
    "PyMuPDF>=1.24,<2",
    "Pillow>=10,<12",
    "opencv-python-headless>=4.10,<5",
    "pytesseract>=0.3.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
